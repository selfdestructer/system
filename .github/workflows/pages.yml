name: Today's Lists

on:
  push:
    branches: [main]
    paths: ['todays-lists/**', '.github/workflows/pages.yml']
  pull_request:
    paths: ['todays-lists/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: todays-lists
  cancel-in-progress: false

defaults:
  run:
    working-directory: todays-lists

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: todays-lists/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
